<svg width="64" height="64" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente de Fundo Cyberpunk -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08140e"/>
      <stop offset="100%" stop-color="#020503"/>
    </linearGradient>

    <!-- Gradiente Neon Verde -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26ff8a"/>
      <stop offset="100%" stop-color="#00cc55"/>
    </linearGradient>

    <!-- Gradiente Brilho Ciano/Verde -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70ffb8"/>
      <stop offset="100%" stop-color="#00e66b"/>
    </linearGradient>

    <!-- Filtro de Brilho Neon (Glow) -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="#00ff73" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fundo com Borda Arredondada Luminosa -->
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="url(#bgGrad)" stroke="#00e66b" stroke-width="1.3" stroke-opacity="0.9"/>

  <!-- Top-Left Finder Eye -->
  <rect x="4.2" y="4.2" width="8.6" height="8.6" rx="2.5" stroke="url(#neonGrad)" stroke-width="1.7"/>
  <rect x="6.3" y="6.3" width="4.4" height="4.4" rx="1.2" fill="url(#neonGrad)"/>

  <!-- Top-Right Finder Eye -->
  <rect x="19.2" y="4.2" width="8.6" height="8.6" rx="2.5" stroke="url(#neonGrad)" stroke-width="1.7"/>
  <rect x="21.3" y="6.3" width="4.4" height="4.4" rx="1.2" fill="url(#neonGrad)"/>

  <!-- Bottom-Left Finder Eye -->
  <rect x="4.2" y="19.2" width="8.6" height="8.6" rx="2.5" stroke="url(#neonGrad)" stroke-width="1.7"/>
  <rect x="6.3" y="21.3" width="4.4" height="4.4" rx="1.2" fill="url(#neonGrad)"/>

  <!-- Bottom-Right Finder Eye (Com ponto branco de destaque) -->
  <rect x="19.2" y="19.2" width="8.6" height="8.6" rx="2.5" stroke="url(#neonGrad)" stroke-width="1.7"/>
  <circle cx="23.5" cy="23.5" r="2.2" fill="#ffffff" filter="url(#neonGlow)"/>

  <!-- Centro Matrix Core -->
  <circle cx="16" cy="16" r="3.8" stroke="#00ff73" stroke-width="0.8" stroke-dasharray="1.5 1" opacity="0.8"/>
  <circle cx="16" cy="16" r="2.5" fill="url(#coreGrad)"/>
  <circle cx="16" cy="16" r="1.1" fill="#ffffff"/>

  <!-- Conectores / Nós de Dados (Brancos e Verdes) -->
  <!-- Superior -->
  <circle cx="16" cy="5.8" r="1.2" fill="#ffffff"/>
  <circle cx="16" cy="9.4" r="0.9" fill="#00ff73"/>

  <!-- Inferior -->
  <circle cx="16" cy="26.2" r="1.2" fill="#ffffff"/>
  <circle cx="16" cy="22.6" r="0.9" fill="#00ff73"/>

  <!-- Esquerda -->
  <circle cx="5.8" cy="16" r="1.2" fill="#ffffff"/>
  <circle cx="9.4" cy="16" r="0.9" fill="#00ff73"/>

  <!-- Direita -->
  <circle cx="26.2" cy="16" r="1.2" fill="#ffffff"/>
  <circle cx="22.6" cy="16" r="0.9" fill="#00ff73"/>
</svg>
